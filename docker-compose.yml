# Kaisel Store — local development environment (production topology target)
# The web prototype in this repo runs standalone (npm run dev); this compose file
# stands up the services the Node backend + worker + artifact-processor will use.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaisel}
      POSTGRES_USER: ${POSTGRES_USER:-kaisel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaisel}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaisel}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kaisel}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kaisel-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - vault:/data

  backend:
    build: ./backend
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./worker
    env_file: .env
    depends_on: [redis, db]

  artifact-processor:
    build: ./artifact-processor     # bundletool + aapt2, non-root, no host mounts beyond intake
    env_file: .env
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    depends_on: [redis, minio]

volumes:
  pgdata:
  vault:
